# ─────────────────────────────────────────────────────
# Heptapus Group — Docker Compose (PostgreSQL + Next.js)
# ─────────────────────────────────────────────────────
# Kullanım:
#   docker compose up -d          # Başlat
#   docker compose logs -f web    # Logları izle
#   docker compose down           # Durdur
#   docker compose up -d --build  # Yeniden build et
# ─────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"       # Sadece localhost'tan erişim
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Next.js Application ──
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      APP_ORIGIN: ${APP_ORIGIN:-https://heptapusgroup.com}
      TRUSTED_PROXY_IP_HEADER: ${TRUSTED_PROXY_IP_HEADER:-}
      LOG_DIR: /app/data/logs
      APP_LOG_PATH: /app/data/logs/app.log
      ERROR_LOG_PATH: /app/data/logs/error.log
    volumes:
      - uploads_data:/app/data/uploads    # Yüklenen dosyalar kalıcı
      - logs_data:/app/data/logs          # Panelden okunan uygulama logları
    depends_on:
      db:
        condition: service_healthy

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    depends_on:
      db:
        condition: service_healthy
    command: sh -lc "npx prisma migrate deploy"
    restart: "no"
    
volumes:
  pg_data:          # PostgreSQL verileri — kalıcı
  uploads_data:     # Yüklenen dosyalar — kalıcı
  logs_data:        # Uygulama stdout/stderr logları — kalıcı
